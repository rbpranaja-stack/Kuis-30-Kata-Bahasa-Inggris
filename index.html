<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Kuis 30 Soal Bahasa Inggris</title>
                <link rel="stylesheet" href="style.css">
                </head>
                <body>

                    <div class="quiz-box">
                            <h2>🇬🇧 Kuis 30 Kata Bahasa Inggris</h2>
                                    <p class="subtitle">Isi semua jawaban (huruf kapital bebas), lalu klik Check Jawaban!</p>

                                            <form class="quiz-form">
                                                        <div class="quiz-container">
                                                                        <!-- Kelompok Soal 1 - 10 (Kata Benda Dasar) -->
                                                                                        <h3>Kategori 1: Benda & Hewan</h3>
                                                                                                        <div class="quiz-item"><label>1. Buku</label><input type="text" placeholder="Jawaban..." pattern="[Bb][Oo][Oo][Kk]" required></div>
                                                                                                                        <div class="quiz-item"><label>2. Kucing</label><input type="text" placeholder="Jawaban..." pattern="[Cc][Aa][Tt]" required></div>
                                                                                                                                        <div class="quiz-item"><label>3. Anjing</label><input type="text" placeholder="Jawaban..." pattern="[Dd][Oo][Gg]" required></div>
                                                                                                                                                        <div class="quiz-item"><label>4. Rumah</label><input type="text" placeholder="Jawaban..." pattern="[Hh][Oo][Uu][Ss][Ee]" required></div>
                                                                                                                                                                        <div class="quiz-item"><label>5. Mobil</label><input type="text" placeholder="Jawaban..." pattern="[Cc][Aa][Rr]" required></div>
                                                                                                                                                                                        <div class="quiz-item"><label>6. Meja</label><input type="text" placeholder="Jawaban..." pattern="[Tt][Aa][Bb][Ll][Ee]" required></div>
                                                                                                                                                                                                        <div class="quiz-item"><label>7. Kursi</label><input type="text" placeholder="Jawaban..." pattern="[Cc][Hh][Aa][Ii][Rr]" required></div>
                                                                                                                                                                                                                        <div class="quiz-item"><label>8. Pintu</label><input type="text" placeholder="Jawaban..." pattern="[Dd][Oo][Oo][Rr]" required></div>
                                                                                                                                                                                                                                        <div class="quiz-item"><label>9. Apel</label><input type="text" placeholder="Jawaban..." pattern="[Aa][Pp][Pp][Ll][Ee]" required></div>
                                                                                                                                                                                                                                                        <div class="quiz-item"><label>10. Burung</label><input type="text" placeholder="Jawaban..." pattern="[Bb][Ii][Rr][Dd]" required></div>

                                                                                                                                                                                                                                                                        <!-- Kelompok Soal 11 - 20 (Waktu & Alam) -->
                                                                                                                                                                                                                                                                                        <h3>Kategori 2: Alam & Waktu</h3>
                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>11. Matahari</label><input type="text" placeholder="Jawaban..." pattern="[Ss][Uu][Nn]" required></div>
                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>12. Bulan</label><input type="text" placeholder="Jawaban..." pattern="[Mm][Oo][Oo][Nn]" required></div>
                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>13. Bintang</label><input type="text" placeholder="Jawaban..." pattern="[Ss][Tt][Aa][Rr]" required></div>
                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>14. Air</label><input type="text" placeholder="Jawaban..." pattern="[Ww][Aa][Tt][Ee][Rr]" required></div>
                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>15. Api</label><input type="text" placeholder="Jawaban..." pattern="[Ff][Ii][Rr][Ee]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>16. Hari</label><input type="text" placeholder="Jawaban..." pattern="[Dd][Aa][Yy]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>17. Malam</label><input type="text" placeholder="Jawaban..." pattern="[Nn][Ii][Gg][Hh][Tt]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>18. Pagi</label><input type="text" placeholder="Jawaban..." pattern="[Mm][Oo][Rr][Nn][Ii][Nn][Gg]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>19. Pohon</label><input type="text" placeholder="Jawaban..." pattern="[Tt][Rr][Ee][Ee]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>20. Laut</label><input type="text" placeholder="Jawaban..." pattern="[Ss][Ee][Aa]" required></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Kelompok Soal 21 - 30 (Kata Kerja & Sifat) -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3>Kategori 3: Kata Kerja & Sifat</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>21. Makan</label><input type="text" placeholder="Jawaban..." pattern="[Ee][Aa][Tt]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>22. Minum</label><input type="text" placeholder="Jawaban..." pattern="[Dd][Rr][Ii][Nn][Kk]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>23. Tidur</label><input type="text" placeholder="Jawaban..." pattern="[Ss][Ll][Ee][Ee][Pp]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>24. Lari</label><input type="text" placeholder="Jawaban..." pattern="[Rr][Uu][Nn]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>25. Besar</label><input type="text" placeholder="Jawaban..." pattern="[Bb][Ii][Gg]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>26. Kecil</label><input type="text" placeholder="Jawaban..." pattern="[Ss][Mm][Aa][Ll][Ll]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>27. Senang</label><input type="text" placeholder="Jawaban..." pattern="[Hh][Aa][Pp][Pp][Yy]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>28. Sedih</label><input type="text" placeholder="Jawaban..." pattern="[Ss][Aa][Dd]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>29. Dingin</label><input type="text" placeholder="Jawaban..." pattern="[Cc][Oo][Ll][Dd]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="quiz-item"><label>30. Panas</label><input type="text" placeholder="Jawaban..." pattern="[Hh][Oo][Tt]" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Area Tombol Tetap Berada di Bawah -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="action-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button type="submit" class="btn-jawab">Check Jawaban 🔍</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button type="reset" class="btn-lanjut">Ulangi Kuis ✨</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Kotak Informasi Kelulusan -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="feedback-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p class="msg-benar">🎉 Sempurna! Semua 30 jawabanmu BENAR!</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
